<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой тест</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">

    <h1 id="test-title">Основы веб-разработки</h1>

    <div id="quiz-screen">

      <p id="progress">Вопрос 1 из 3</p>

      <div id="question-text">

      </div>

      <div id="options"  class="options" >
  
      </div>

      <div class="buttons">
        <button id="btn-back">« Назад</button>
        <button id="btn-next">Далее »</button>
        <button id="btn-finish" style="display: none;">Завершить тест</button>
      </div>

      <div id="timer">
        Осталось времени: <span id="time-left">05:00</span>
      </div>

    </div>

    <div id="result-screen" style="display: none;">
      <h2>Результат теста</h2>
      
      <p id="score-text">Правильных ответов: 0 из 3</p>
      <p id="percentage" class="percentage">0%</p>
      
      <p id="status" class="status">Пройден</p>

      <div class="result-buttons">
        <button id="btn-restart">Пройти заново</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
